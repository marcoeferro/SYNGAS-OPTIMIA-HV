# =============================================================
# Programación del ETL (Ofelia)
# =============================================================
# Editá SOLO la línea "schedule" para cambiar cuándo corre el
# scraper/pipeline. No hace falta rebuild de la imagen.
#
# Formato cron de Ofelia (6 campos, con SEGUNDOS al principio):
#   segundo  minuto  hora  día-del-mes  mes  día-de-la-semana
# La imagen mcuadros/ofelia:latest (0.3.x) exige el campo de segundos;
# con 5 campos ("0 6 * * *") el horario se interpreta mal.
#
# Ejemplos:
#   0 0 6 * * *     → todos los días a las 06:00 (hora del TZ del contenedor)
#   0 0 */12 * * *  → cada 12 horas
#   0 30 7 * * 1-5  → lunes a viernes a las 07:30
#   0 0 0 1 * *     → el día 1 de cada mes a medianoche
#   @daily          → también se aceptan atajos (@hourly, @every 6h, ...)
#
# Tras cambiar este archivo, reiniciá el scheduler:
#   docker compose restart scheduler
#
# Job único: extract (CBA + MAGYP) + transform + load + energía/finanzas.
# Los CSV raw se versionan con prefijo YYYYMMDDHHMMSS_.
# Para separar extract de transform, usar dos jobs y
#   python -m optimia_hv.biomasa.pipelines.run_biomasa --skip-extract
# =============================================================

[job-exec "etl-biomasa"]
schedule = 0 0 6 * * *
container = biomasa_etl_worker
command = python -m optimia_hv.biomasa.pipelines.run_biomasa --config config/paths.yaml

# Pipeline solar (ex main_actualizaciones.py): generación Growatt de ayer,
# clima NASA/Open-Meteo de los últimos 30 días, pronóstico y energía
# pronosticada. Necesita GROWATT_USER, GROWATT_PASSWORD y GROWATT_PLANT_ID
# en .env (sin ellas sólo fallan los pasos de Growatt).
[job-exec "solar"]
schedule = 0 30 6 * * *
container = biomasa_etl_worker
command = python -m optimia_hv.solar.pipelines.run_solar --config config/solar.yaml
