# =============================================================
# Programación del ETL (Ofelia)
# =============================================================
# Editá SOLO la línea "schedule" para cambiar cuándo corre el
# scraper/pipeline. No hace falta rebuild de la imagen.
#
# Formato cron (5 campos):
#   minuto  hora  día-del-mes  mes  día-de-la-semana
#
# Ejemplos:
#   0 6 * * *     → todos los días a las 06:00 (hora del TZ del host/container)
#   0 */12 * * *  → cada 12 horas
#   30 7 * * 1-5  → lunes a viernes a las 07:30
#   0 0 1 * *     → el día 1 de cada mes a medianoche
#
# Tras cambiar este archivo, reiniciá el scheduler:
#   docker compose restart scheduler
# =============================================================

[job-exec "etl-biomasa"]
schedule = 0 6 * * *
container = biomasa_etl_worker
command = python -m etl.pipelines.run_etl --config config/paths.yaml
