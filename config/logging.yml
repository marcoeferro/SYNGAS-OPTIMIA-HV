# =============================================================
# Configuración de logging estilo stdlib dictConfig.
# Se carga una sola vez desde el entrypoint (run_etl.py).
#
# Salida: una línea JSON por evento (etl/logging_setup.py), con nivel,
# hora, archivo/línea, entorno, trace_id de la corrida y request_id de
# cada pedido HTTP. Variables de entorno:
#   LOG_LEVEL   nivel mínimo de la consola (INFO)
#   LOG_FORMAT  json (por defecto) | text, para leer a mano en local
#   LOG_STREAM  archivo de la consola en vez de stdout (/proc/1/fd/1 en
#               etl_worker: los logs salen en "docker logs" del worker)
#   APP_ENV     entorno informado en cada línea (local por defecto)
# =============================================================

version: 1
disable_existing_loggers: false

formatters:
  json:
    (): etl.logging_setup.JsonFormatter
  text:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    (): etl.logging_setup.ContainerStreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/pipeline.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf-8

loggers:
  etl:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  # pypdf avisa cada objeto mal referenciado de los PDF de tarifas
  # ("Ignoring wrong pointing object"): ruido sin efecto en el resultado.
  pypdf:
    level: ERROR

root:
  level: WARNING
  handlers: [console, file]
