# =============================================================
# Producción en Dokploy (VPS). Ver deploy/README.md.
# =============================================================
# En Dokploy: Create Service → Compose → repo de GitHub, rama main,
# Compose Path = ./deploy/docker-compose.dokploy.yml.
#
# - Dokploy construye la imagen en el servidor (git clone + build) en
#   cada deploy.
# - Los datos van en volúmenes con nombre: Dokploy borra la carpeta del
#   repo en cada deploy, así que ./data (bind mount) se perdería. La
#   primera vez el volumen se llena con data/raw y data/reference de la
#   imagen.
# - Los secretos se cargan en la pestaña Environment: Dokploy los escribe
#   en .env junto a este archivo y env_file los pasa a los contenedores.
# - El dominio se configura en la pestaña Domains (servicio dashboard,
#   puerto 8501): Traefik pone el HTTPS. No se publican puertos al host.
# - Sin container_name: Dokploy maneja los nombres (logs, rollbacks).
# =============================================================

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: optimia-hv:dokploy
  env_file:
    - path: .env
      required: false
  environment:
    - TZ=${TZ:-America/Argentina/Buenos_Aires}
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
  restart: unless-stopped

services:
  # Cron: corre los extractores / pipelines según config/crontab.
  cron:
    <<: *app
    command: ["sh", "deploy/cron-entrypoint.sh"]
    init: true
    volumes:
      - optimia_data:/app/data
      - optimia_logs:/app/logs

  # Dashboard: Traefik (Dokploy) lo publica en el dominio configurado.
  dashboard:
    <<: *app
    depends_on: [cron]
    command:
      [
        "streamlit", "run", "src/optimia_hv/dashboard/app.py",
        "--server.address=0.0.0.0", "--server.port=8501",
        "--browser.gatherUsageStats=false",
      ]
    expose:
      - "8501"
    volumes:
      - optimia_data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  optimia_data:
  optimia_logs:
