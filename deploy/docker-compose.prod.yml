# =============================================================
# Producción (servidor de DonWeb). Usa la imagen publicada por
# .github/workflows/deploy.yml: en el servidor no se compila nada.
#
# deploy/deploy.sh exporta OPTIMIA_IMAGE con el tag del commit.
# Los datos viven en el servidor (./data, ./logs) y sobreviven a cada
# deploy. Los secretos se leen de ./.env (no versionado; ver .env.example).
# =============================================================

x-app: &app
  image: ${OPTIMIA_IMAGE:-ghcr.io/marcoeferro/optimia:latest}
  env_file:
    - path: .env
      required: false
  environment:
    - TZ=${TZ:-America/Argentina/Buenos_Aires}
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./config:/app/config:ro
  restart: unless-stopped

services:
  # Contenedor permanente donde Ofelia ejecuta los pipelines.
  worker:
    <<: *app
    container_name: optimia_worker
    user: "0:0"
    command: ["sleep", "infinity"]

  # Cron (config/schedule.ini). El job apunta a container = biomasa_etl_worker
  # en desarrollo; deploy.sh lo reescribe a optimia_worker.
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: optimia_scheduler
    depends_on: [worker]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./schedule.prod.ini:/etc/ofelia/config.ini:ro
    command: ["daemon", "--config=/etc/ofelia/config.ini"]
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    restart: unless-stopped

  # Dashboard: sólo escucha en localhost; Nginx lo publica con HTTPS.
  dashboard:
    <<: *app
    container_name: optimia_dashboard
    depends_on: [worker]
    command:
      [
        "streamlit", "run", "src/optimia_hv/dashboard/app.py",
        "--server.address=0.0.0.0", "--server.port=8501",
        "--browser.gatherUsageStats=false",
      ]
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
