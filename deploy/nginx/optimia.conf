# Nginx delante de Streamlit. Copiar a /etc/nginx/sites-available/optimia,
# enlazar en sites-enabled, cambiar server_name y obtener el certificado:
#   sudo certbot --nginx -d optimia.tudominio.com.ar
# (certbot agrega el bloque 443 y la redirección desde 80).

server {
    listen 80;
    server_name optimia.tudominio.com.ar;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit usa WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
