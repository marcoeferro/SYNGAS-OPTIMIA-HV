<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560" viewBox="0 0 1150 560" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a5b6472" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker><marker id="a2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="aeb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a14915f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14915f"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="1150" height="560" fill="#fff"/><rect x="20" y="20" width="330" height="520" rx="12" fill="none" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="6 5"/><text x="34" y="42" font-size="13" font-weight="700" fill="#2a78d6">Arquitectura de SSH (RFC 4251)</text><rect x="40" y="60" width="290" height="100" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.4"/><text x="185.0" y="99.36" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Protocolo de conexión</text><text x="185.0" y="115.46" text-anchor="middle" font-size="11.5" fill="#5b6472">RFC 4254 · canales multiplexados</text><text x="185.0" y="131.56" text-anchor="middle" font-size="11.5" fill="#5b6472">shell · exec · reenvío de puertos</text><rect x="40" y="180" width="290" height="100" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.4"/><text x="185.0" y="219.36" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Autenticación de usuario</text><text x="185.0" y="235.46" text-anchor="middle" font-size="11.5" fill="#5b6472">RFC 4252 · clave pública,</text><text x="185.0" y="251.56" text-anchor="middle" font-size="11.5" fill="#5b6472">contraseña o certificado</text><rect x="40" y="300" width="290" height="100" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.4"/><text x="185.0" y="339.36" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Capa de transporte</text><text x="185.0" y="355.46000000000004" text-anchor="middle" font-size="11.5" fill="#5b6472">RFC 4253 · intercambio de claves,</text><text x="185.0" y="371.56" text-anchor="middle" font-size="11.5" fill="#5b6472">cifrado, integridad, host key</text><rect x="40" y="420" width="290" height="90" rx="8" fill="#f3f4f6" stroke="#5b6472" stroke-width="1.4"/><text x="185.0" y="462.18" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">TCP/IP</text><text x="185.0" y="478.28000000000003" text-anchor="middle" font-size="11.5" fill="#5b6472">puerto 22</text><line x1="470" y1="64" x2="470" y2="540" stroke="#5b6472" stroke-dasharray="4 4"/><line x1="1050" y1="64" x2="1050" y2="540" stroke="#5b6472" stroke-dasharray="4 4"/><rect x="400" y="22" width="140" height="40" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.4"/><text x="470.0" y="47.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Cliente</text><rect x="970" y="22" width="160" height="40" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.4"/><text x="1050.0" y="47.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Servidor (VPS)</text><line x1="472" y1="110" x2="1048" y2="110" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a5b6472)"/><text x="760" y="100" text-anchor="middle" font-size="12.5" fill="#1f2937">1. Conexión TCP al puerto 22 e intercambio de versiones</text><line x1="472" y1="161" x2="1048" y2="161" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a5b6472)"/><line x1="1048" y1="167" x2="472" y2="167" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a5b6472)"/><text x="760" y="154" text-anchor="middle" font-size="12.5" fill="#1f2937">2. KEXINIT: negociación de algoritmos</text><line x1="472" y1="215" x2="1048" y2="215" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a2a78d6)"/><line x1="1048" y1="221" x2="472" y2="221" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a2a78d6)"/><text x="760" y="208" text-anchor="middle" font-size="12.5" fill="#1f2937">3. Intercambio de claves ECDH (Curve25519) → secreto compartido</text><line x1="1048" y1="272" x2="472" y2="272" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a2a78d6)"/><text x="760" y="262" text-anchor="middle" font-size="12.5" fill="#1f2937">4. El servidor firma con su host key; el cliente la verifica (known_hosts)</text><line x1="472" y1="323" x2="1048" y2="323" stroke="#14915f" stroke-width="1.6" marker-end="url(#a14915f)"/><line x1="1048" y1="329" x2="472" y2="329" stroke="#14915f" stroke-width="1.6" marker-end="url(#a14915f)"/><text x="760" y="316" text-anchor="middle" font-size="12.5" fill="#1f2937">5. NEWKEYS: desde aquí todo viaja cifrado (AES-GCM / ChaCha20)</text><line x1="472" y1="380" x2="1048" y2="380" stroke="#eb6834" stroke-width="1.6" marker-end="url(#aeb6834)"/><text x="760" y="370" text-anchor="middle" font-size="12.5" fill="#1f2937">6. Autenticación publickey: firma con la clave privada (ed25519)</text><line x1="1048" y1="434" x2="472" y2="434" stroke="#eb6834" stroke-width="1.6" marker-end="url(#aeb6834)"/><text x="760" y="424" text-anchor="middle" font-size="12.5" fill="#1f2937">7. El servidor verifica contra authorized_keys o la CA</text><line x1="472" y1="488" x2="1048" y2="488" stroke="#1f2937" stroke-width="1.6" marker-end="url(#a1f2937)"/><text x="760" y="478" text-anchor="middle" font-size="12.5" fill="#1f2937">8. Canal de sesión: comando «deploy» o shell interactiva</text></svg>