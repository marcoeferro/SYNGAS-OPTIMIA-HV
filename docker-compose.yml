# =============================================================
# Orquestación de servicios de OPTIMIA-HV (desarrollo / local)
# =============================================================
# Servicios:
#   - cron:         supercronic corre los pipelines (biomasa y solar)
#                   según config/crontab.
#   - etl_pipeline: Job one-shot manual (docker compose --profile etl run ...).
#   - dashboard:    Streamlit sobre los Parquet.
#
# Producción (Dokploy): deploy/docker-compose.dokploy.yml (volúmenes con
# nombre en vez de ./data, sin puertos publicados; ver deploy/README.md).
#
# Arranque típico (Windows / Linux / macOS, sin Make):
#   docker compose up -d --build
#
# Nota permisos (Windows/Docker Desktop):
#   Los bind mounts de ./data y ./logs suelen no ser escribibles por
#   el usuario no-root de la imagen (appuser uid 1000). Por eso
#   cron y etl_pipeline corren como root dentro del contenedor.
# =============================================================

x-pipeline: &pipeline
  build:
    context: .
    dockerfile: Dockerfile
  image: optimia-hv:latest
  user: "0:0"
  volumes:
    - ./data:/app/data
    - ./config:/app/config:ro
    - ./logs:/app/logs
  environment:
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - TZ=${TZ:-America/Argentina/Buenos_Aires}
    # Avisos de fallas y alertas (opcionales, ver docs/04_arquitectura/despliegue.md)
    - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    - NOTIFY_ON_SUCCESS=${NOTIFY_ON_SUCCESS:-}
    # Pipeline solar: portal Growatt y réplica opcional en MySQL (ver .env.example)
    - GROWATT_USER=${GROWATT_USER:-}
    - GROWATT_PASSWORD=${GROWATT_PASSWORD:-}
    - GROWATT_PLANT_ID=${GROWATT_PLANT_ID:-}
    - SOLAR_DB_URL=${SOLAR_DB_URL:-}
    # Primera carga al arrancar el cron (auto | si | no; ver deploy/cron-entrypoint.sh)
    - ETL_AL_INICIAR=${ETL_AL_INICIAR:-auto}

services:
  # -----------------------------------------------------------
  # Cron (supercronic): corre los pipelines según config/crontab
  # -----------------------------------------------------------
  cron:
    <<: *pipeline
    command: ["sh", "deploy/cron-entrypoint.sh"]
    init: true
    restart: unless-stopped

  # -----------------------------------------------------------
  # Pipeline ETL one-shot (ejecución manual bajo demanda)
  # -----------------------------------------------------------
  etl_pipeline:
    <<: *pipeline
    profiles:
      - etl
    restart: "no"

  # -----------------------------------------------------------
  # Dashboard Streamlit
  # -----------------------------------------------------------
  dashboard:
    image: optimia-hv:latest
    depends_on:
      - cron
    command:
      [
        "streamlit",
        "run",
        "src/optimia_hv/dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--browser.gatherUsageStats=false",
      ]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - DATOS_VIEJOS_HORAS=${DATOS_VIEJOS_HORAS:-48}
    restart: unless-stopped
