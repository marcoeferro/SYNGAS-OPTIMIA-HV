# =============================================================
# Orquestación de servicios del proyecto Biomasa Residual
# =============================================================
# Servicios:
#   - etl_worker:   Contenedor permanente donde Ofelia ejecuta el ETL.
#   - etl_pipeline: Job one-shot manual (docker compose --profile etl run ...).
#   - scheduler:    Ofelia lee config/schedule.ini y dispara el ETL.
#   - dashboard:    Streamlit sobre los Parquet.
#
# Arranque típico (Windows / Linux / macOS, sin Make):
#   docker compose up -d --build
#
# Nota permisos:
#   etl_worker y etl_pipeline corren sin privilegios, con el uid/gid de
#   ETL_UID/ETL_GID (por defecto 1000, el appuser de la imagen). En el
#   servidor, ./data y ./logs deben pertenecer a ese usuario:
#     sudo chown -R 1000:1000 data logs
#   El tablero se publica solo en 127.0.0.1: se accede por el proxy
#   inverso (Caddy) o por la red privada, no directamente desde Internet.
# =============================================================

services:
  # -----------------------------------------------------------
  # Worker ETL (permanece vivo; el scheduler ejecuta comandos aquí)
  # -----------------------------------------------------------
  etl_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: etl-biomasa:latest
    container_name: biomasa_etl_worker
    user: "${ETL_UID:-1000}:${ETL_GID:-1000}"
    command: ["sleep", "infinity"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      # Avisos de fallas y alertas (opcionales, ver docs/04_arquitectura/despliegue.md)
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NOTIFY_ON_SUCCESS=${NOTIFY_ON_SUCCESS:-}
    restart: unless-stopped

  # -----------------------------------------------------------
  # Pipeline ETL one-shot (ejecución manual bajo demanda)
  # -----------------------------------------------------------
  etl_pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: etl-biomasa:latest
    container_name: biomasa_etl
    user: "${ETL_UID:-1000}:${ETL_GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      # Avisos de fallas y alertas (opcionales, ver docs/04_arquitectura/despliegue.md)
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NOTIFY_ON_SUCCESS=${NOTIFY_ON_SUCCESS:-}
    profiles:
      - etl
    restart: "no"

  # -----------------------------------------------------------
  # Scheduler (Ofelia): cron configurado en config/schedule.ini
  # -----------------------------------------------------------
  scheduler:
    # Versión fija (0.3.22) y digest: el planificador no cambia sin aviso.
    image: mcuadros/ofelia:0.3.22@sha256:efcbe2c5cf658a25de6443c1462d653f9cc03791d642e01fc6c638a00f97e492
    container_name: biomasa_scheduler
    depends_on:
      - etl_worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/schedule.ini:/etc/ofelia/config.ini:ro
    command: ["daemon", "--config=/etc/ofelia/config.ini"]
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    restart: unless-stopped

  # -----------------------------------------------------------
  # Dashboard Streamlit
  # -----------------------------------------------------------
  dashboard:
    image: etl-biomasa:latest
    container_name: biomasa_dashboard
    depends_on:
      - etl_worker
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--browser.gatherUsageStats=false",
      ]
    ports:
      # DASHBOARD_PORT admite "8501" (todas las interfaces) o "127.0.0.1:8501".
      - "${DASHBOARD_PORT:-127.0.0.1:8501}:8501"
    volumes:
      - ./data:/app/data:ro
      - ./dashboard:/app/dashboard:ro
      - ./config:/app/config:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - DATOS_VIEJOS_HORAS=${DATOS_VIEJOS_HORAS:-192}
    restart: unless-stopped