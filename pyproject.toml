# =============================================================
# Configuración del proyecto ETL Biomasa Residual
# =============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================
# Metadatos del proyecto
# =============================================================
[project]
name = "etl-biomasa"
version = "0.3.0"
description = "Pipeline ETL para estimación de biomasa residual agrícola en Argentina"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Proyecto Biomasa", email = "contacto@example.com" }
]
keywords = ["biomasa", "agro", "etl", "argentina", "energia", "duckdb", "streamlit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# =============================================================
# Dependencias de runtime (pipeline ETL + extractors)
# =============================================================
# Inventario de imports de terceros en etl/, dashboard/, tests/, notebooks/:
#   pandas, numpy, pyarrow, duckdb, PyYAML (yaml), plotly, matplotlib,
#   seaborn, openpyxl, httpx, beautifulsoup4 (bs4), curl_cffi, streamlit,
#   pytest (+ tooling de desarrollo).
# =============================================================
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "PyYAML>=6.0",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.7",
    "xlrd>=2.0.1",
    "pypdf>=4.0",
]

# =============================================================
# Dependencias opcionales por grupo
# =============================================================
[project.optional-dependencies]
# Núcleo ETL = [project].dependencies (sin extra adicional)
etl = []
dashboard = [
    "streamlit>=1.32",
    "plotly>=5.18",
]
dev = [
    # El dashboard tiene tests (tests/test_dashboard.py).
    "streamlit>=1.32",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]
all = [
    "etl-biomasa[dashboard,dev]",
]

# =============================================================
# Entry points
# =============================================================
[project.scripts]
etl-biomasa = "etl.pipelines.run_etl:main"

[project.urls]
Homepage = "https://github.com/marcoeferro/SYNGAS-OPTIMIA-HV"
Repository = "https://github.com/marcoeferro/SYNGAS-OPTIMIA-HV"
Issues = "https://github.com/marcoeferro/SYNGAS-OPTIMIA-HV/issues"

# =============================================================
# Configuración de setuptools
# =============================================================
[tool.setuptools]
packages = { find = { include = ["etl*", "dashboard*"] } }

# =============================================================
# Configuración de pytest
# =============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# =============================================================
# Configuración de ruff (linter + formatter)
# =============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "D",
]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

# =============================================================
# Configuración de mypy
# =============================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["build", "dist", "notebooks"]

[[tool.mypy.overrides]]
module = ["plotly.*", "seaborn.*", "duckdb.*"]
ignore_missing_imports = true

# =============================================================
# Configuración de coverage
# =============================================================
[tool.coverage.run]
source = ["etl"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]