# Deploy a producción (Dokploy en el VPS) cuando el CI termina verde en
# main.
#
# Dokploy construye la imagen en el servidor (git clone + docker compose
# up --build, ver deploy/docker-compose.dokploy.yml). Este workflow sólo
# le pide el deploy por la API de Dokploy (compose.deploy), así nunca se
# despliega un commit con tests rotos.
#
# Se usa la API y no el webhook ("Webhook URL" de Deployments) porque el
# webhook de Dokploy responde 400 si el Autodeploy está apagado, y con el
# Autodeploy prendido Dokploy despliega en cada push aunque el CI falle.
# En Dokploy: Autodeploy **apagado**.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   DOKPLOY_URL          URL del panel, sin barra final (https://panel.midominio.com)
#   DOKPLOY_API_KEY      Dokploy → Settings → Profile → API/CLI → Generate
#   DOKPLOY_COMPOSE_ID   ID del servicio compose (último tramo de su URL en el panel)
# Sin los secretos el job no hace nada.
#
# environment: production permite exigir una aprobación manual antes de
# desplegar (Settings → Environments → production → Required reviewers).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # La API encola el deploy y responde enseguida: el resultado del
      # build se ve en Dokploy → servicio → Deployments.
      - name: Pedir el deploy a Dokploy
        if: env.DOKPLOY_URL != '' && env.DOKPLOY_API_KEY != '' && env.DOKPLOY_COMPOSE_ID != ''
        run: |
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\", \"title\": \"CI verde: ${COMMIT::7}\"}"

      - name: Sin secretos configurados
        if: env.DOKPLOY_URL == '' || env.DOKPLOY_API_KEY == '' || env.DOKPLOY_COMPOSE_ID == ''
        run: echo "Faltan DOKPLOY_URL, DOKPLOY_API_KEY o DOKPLOY_COMPOSE_ID; no se despliega."
