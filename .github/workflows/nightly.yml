# Tests de contrato: llaman a las APIs reales (Growatt, NASA POWER,
# Open-Meteo, fuentes de biomasa) para detectar cambios de formato.
#
# No corren en los PR: una API caída no debe bloquear un merge. Corren
# todas las noches y a mano (Actions → Nightly → Run workflow). Los
# secretos (p. ej. GROWATT_USER / GROWATT_PASSWORD) se cargan en
# Settings → Secrets and variables → Actions del repo principal.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"   # 03:17 en Argentina (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    # Los forks no tienen los secretos: sólo en el repo principal.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'marcoeferro/optimia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[solar]" pytest

      - name: Tests de contrato (APIs reales)
        env:
          GROWATT_USER: ${{ secrets.GROWATT_USER }}
          GROWATT_PASSWORD: ${{ secrets.GROWATT_PASSWORD }}
        run: pytest -q -m contract || [ $? -eq 5 ]
