# Integración continua: tests y chequeos en cada push y pull request.
#
# - tests: pytest + errores reales de lint (pyflakes y sintaxis). El resto
#   del estilo (ruff completo) no bloquea: el repo tiene avisos previos.
# - imagen: construye la imagen Docker sólo si cambian Dockerfile,
#   pyproject.toml o .dockerignore (es el paso más largo).
# - automerge: si tests e imagen pasan en un pull request hacia main, lo
#   mergea (merge commit, como los PR anteriores). Se omite en borradores,
#   en PR desde forks y en PR con la etiqueta `no-automerge`.
# - deploy: despliega al VPS cada commit nuevo de main (push directo o PR
#   mergeado por automerge).
#
# El repo es privado: Actions cobra minutos (2000 gratis por mes). Por eso
# se instala sólo lo necesario, se cachea pip y se cancelan las corridas
# viejas de la misma rama.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dashboard]" pytest ruff

      - name: Lint (errores reales)
        run: ruff check --select E9,F etl dashboard tests

      - name: Tests
        run: pytest -q

  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Cambió la imagen?
        id: cambios
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if git diff --quiet "$base" HEAD -- Dockerfile pyproject.toml .dockerignore 2>/dev/null; then
            echo "construir=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en la imagen: se omite el build."
          else
            echo "construir=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build de la imagen
        if: steps.cambios.outputs.construir == 'true'
        run: docker build -t etl-biomasa:ci .

      - name: Humo (imports dentro de la imagen)
        if: steps.cambios.outputs.construir == 'true'
        run: |
          docker run --rm etl-biomasa:ci python -c "import etl.pipelines.run_etl, etl.transformers.data_checks; print('ETL ok')"
          docker run --rm etl-biomasa:ci python -c "import streamlit, dashboard.data_loader; print('dashboard ok')"

  automerge:
    needs: [tests, imagen]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # --match-head-commit: no mergea si llegó un push nuevo mientras
      # corría el CI (ese push tiene su propia corrida).
      - name: Mergear el pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --merge \
            --match-head-commit "${{ github.event.pull_request.head.sha }}"
          sha="$(gh pr view "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}" --json mergeCommit -q .mergeCommit.oid)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Deploy al VPS de cada commit nuevo de main: un push directo que pasa tests
  # e imagen, o el merge que hizo automerge (el merge con GITHUB_TOKEN no
  # dispara otro workflow, por eso se encadena acá). Entra con una clave que solo puede desplegar
  # Optimia (vps-ops: deploy-gate → deploy-git): el VPS avanza su copia de git
  # hasta este commit, arma la imagen y levanta los servicios. Si el dashboard
  # no responde, vuelve al commit anterior. Si el ETL está corriendo, no
  # despliega (reintentar con "Re-run jobs").
  deploy:
    needs: [tests, imagen, automerge]
    if: >-
      always() &&
      needs.tests.result == 'success' && needs.imagen.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       needs.automerge.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Saltear si el deploy no está habilitado
        if: vars.DEPLOY_ENABLED != 'true'
        run: echo "::notice::DEPLOY_ENABLED no es true en production; no se despliega."

      - name: Deploy por SSH
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          HOST: ${{ vars.VPS_HOST }}
          SHA: ${{ needs.automerge.outputs.sha || github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA inválido: $SHA"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Primera línea de stdin: token de ghcr.io (vacío: no hace falta).
          echo "" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "deploy@$HOST" "production $SHA"
